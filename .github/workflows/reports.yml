name: Fishing reports

on:
  schedule:
    - cron: '17 */4 * * *'     # every 4 hours
  workflow_dispatch:            # "Run workflow" button on the Actions tab

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect reports
        run: python tools/fetch_reports.py .
      - name: Save reports.json
        run: |
          git config user.name "dustex-reports-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports.json
          git diff --cached --quiet || git commit -m "Update fishing reports"
          git push
